<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-label="Agent Fleet">
  <!--
    Mark: three parallel process lanes on a hard field.
    Middle lane is the active agent (violet). No network nodes, no wordmark.
  -->
  <rect width="128" height="128" rx="24" fill="#0A0A0B"/>
  <!-- lanes -->
  <rect x="28" y="32" width="14" height="64" rx="3" fill="#3F3F46"/>
  <rect x="57" y="24" width="14" height="80" rx="3" fill="#7C3AED"/>
  <rect x="86" y="40" width="14" height="48" rx="3" fill="#3F3F46"/>
</svg>
