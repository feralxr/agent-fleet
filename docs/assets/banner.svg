<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Agent Fleet banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#09090B"/>
      <stop offset="100%" stop-color="#1C1528"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="320" fill="url(#bg)"/>
  <!-- subtle grid -->
  <g stroke="#27272A" stroke-width="1">
    <path d="M0 80 H1200"/><path d="M0 160 H1200"/><path d="M0 240 H1200"/>
    <path d="M200 0 V320"/><path d="M400 0 V320"/><path d="M600 0 V320"/><path d="M800 0 V320"/><path d="M1000 0 V320"/>
  </g>
  <!-- mark -->
  <rect x="72" y="96" width="96" height="96" rx="22" fill="#12101A" stroke="#6D28D9" stroke-width="2"/>
  <circle cx="96" cy="128" r="7" fill="#4ADE80"/>
  <circle cx="120" cy="128" r="7" fill="#A78BFA"/>
  <circle cx="144" cy="128" r="7" fill="#38BDF8"/>
  <path d="M96 136 V152 H120 V160" fill="none" stroke="#52525B" stroke-width="2" stroke-linecap="round"/>
  <path d="M120 136 V160" fill="none" stroke="#A78BFA" stroke-width="2" stroke-linecap="round"/>
  <path d="M144 136 V152 H120 V160" fill="none" stroke="#52525B" stroke-width="2" stroke-linecap="round"/>
  <rect x="104" y="160" width="32" height="16" rx="5" fill="#6D28D9"/>
  <!-- wordmark -->
  <text x="200" y="145" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="52" font-weight="700" fill="#FAFAFA">Agent Fleet</text>
  <text x="200" y="185" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#A78BFA">TUI cockpit for parallel coding agents</text>
  <!-- pills -->
  <rect x="200" y="210" width="88" height="28" rx="14" fill="#1C1528" stroke="#3F3F46"/>
  <text x="244" y="229" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#4ADE80">PTY</text>
  <rect x="298" y="210" width="120" height="28" rx="14" fill="#1C1528" stroke="#3F3F46"/>
  <text x="358" y="229" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#A78BFA">worktrees</text>
  <rect x="428" y="210" width="100" height="28" rx="14" fill="#1C1528" stroke="#3F3F46"/>
  <text x="478" y="229" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#38BDF8">fan-out</text>
  <rect x="538" y="210" width="90" height="28" rx="14" fill="#1C1528" stroke="#3F3F46"/>
  <text x="583" y="229" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#FBBF24">diff</text>
</svg>
