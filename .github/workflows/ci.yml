name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
      - name: Test
        run: go test ./...
      - name: Build
        run: go build -o fleet ./cmd/fleet

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
      - name: Cross-compile
        run: |
          mkdir -p dist
          VERSION=${GITHUB_REF_NAME}
          for pair in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            OS=${pair%/*}; ARCH=${pair#*/}
            EXT=""; [ "$OS" = "windows" ] && EXT=".exe"
            GOOS=$OS GOARCH=$ARCH go build -ldflags "-s -w -X main.version=$VERSION" \
              -o "dist/fleet-${OS}-${ARCH}${EXT}" ./cmd/fleet
          done
          cd dist && sha256sum * > checksums.txt
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
